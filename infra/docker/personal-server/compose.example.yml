services:
  locoris-personal-server:
    image: ghcr.io/locoris/locoris-server:latest
    environment:
      PORT: "${LOCORIS_PORT:-26747}"
      SYNC_PUBLIC_URL: "${LOCORIS_PUBLIC_URL:-http://localhost:26747}"
      SYNC_MANAGEMENT_TOKEN: "${LOCORIS_RECOVERY_TOKEN:-}"
      SYNC_DATA_DIR: "/data"
      SYNC_JOURNAL_MAX_BYTES: "2097152"
    ports:
      - "${LOCORIS_PORT:-26747}:${LOCORIS_PORT:-26747}"
    volumes:
      - locoris-personal-data:/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  locoris-personal-data:
