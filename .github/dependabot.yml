version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /apps/app/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /infra/docker/personal-server
    schedule:
      interval: weekly
      day: monday
      time: "07:45"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    labels:
      - dependencies
