name: Personal Server Release
run-name: Locoris Server release · ${{ github.ref_name }}

on:
  push:
    tags:
      - "server-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing server-v* tag to rebuild
        required: true
        type: string

concurrency:
  group: personal-server-release-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"
  IMAGE_NAME: ghcr.io/locoris/locoris-server
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"

jobs:
  prepare-release:
    name: Prepare atomic server release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate tag, compatibility contract, and release notes
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_TAG}" =~ ^server-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match server-vX.Y.Z." >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/${REQUESTED_TAG}^{commit}"
          VERSION="${REQUESTED_TAG#server-v}"
          PACKAGE_VERSION="$(node -p "require('./apps/personal-server/package.json').version")"
          CONTRACT_VERSION="$(node -p "require('./docs/self-hosting/compatibility.json').serverVersion")"
          if [ "${VERSION}" != "${PACKAGE_VERSION}" ] || [ "${VERSION}" != "${CONTRACT_VERSION}" ]; then
            echo "Tag, package, and compatibility versions must match (${VERSION}, ${PACKAGE_VERSION}, ${CONTRACT_VERSION})." >&2
            exit 1
          fi
          npm run release:notes:check -- --kind server --version "${VERSION}"
          echo "tag=${REQUESTED_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Create or reset hidden draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="docs/releases/server/${VERSION}.md"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --draft --prerelease=false --notes-file "${NOTES}" --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" --verify-tag --draft --title "Locoris Server ${VERSION}" --notes-file "${NOTES}" --repo "${GITHUB_REPOSITORY}"
          fi

  desktop:
    name: Build Locoris Server · ${{ matrix.label }}
    needs: prepare-release
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS Apple Silicon
            artifact: macos-arm64
          - os: windows-2025
            label: Windows x64
            artifact: windows-x64
          - os: ubuntu-24.04
            label: Linux x64
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci --prefer-offline --no-audit; then exit 0; fi
            if [ "${attempt}" = "3" ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - run: npm test --workspace @locoris/personal-server
      - run: npm run desktop:dist --workspace @locoris/personal-server
      - run: npm run desktop:smoke --workspace @locoris/personal-server
      - run: npm run desktop:checksums --workspace @locoris/personal-server -- ${{ matrix.artifact }}
      - name: Verify ad-hoc macOS application signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find apps/personal-server/release-server/mac-arm64 -maxdepth 1 -name '*.app' -print -quit)"
          test -n "${APP_PATH}"
          codesign --verify --deep --strict "${APP_PATH}"
          codesign --display --verbose=2 "${APP_PATH}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: locoris-server-${{ matrix.artifact }}
          path: |
            apps/personal-server/release-server/*.AppImage
            apps/personal-server/release-server/*.deb
            apps/personal-server/release-server/*.dmg
            apps/personal-server/release-server/*.exe
            apps/personal-server/release-server/*.zip
            apps/personal-server/release-server/SHA256SUMS-*.txt
          if-no-files-found: error

  docker-build:
    name: Docker · ${{ matrix.platform }}
    needs: prepare-release
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push native architecture image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/personal-server/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.prepare-release.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}
      - name: Smoke-test image
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.prepare-release.outputs.version }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker run --detach --name locoris-server-smoke "${IMAGE}"
          trap 'docker rm --force locoris-server-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            STATUS="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' locoris-server-smoke)"
            if [ "${STATUS}" = "healthy" ]; then exit 0; fi
            if [ "${STATUS}" = "unhealthy" ]; then docker logs locoris-server-smoke; exit 1; fi
            sleep 2
          done
          docker logs locoris-server-smoke
          exit 1
  docker-manifest:
    name: Sign multi-arch Docker manifest
    needs:
      - prepare-release
      - docker-build
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create versioned and latest manifests
        id: manifest
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${VERSION}" \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${VERSION}-amd64" \
            "${IMAGE_NAME}:${VERSION}-arm64"
          docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
          if [[ ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then echo "Could not resolve manifest digest." >&2; exit 1; fi
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify manifest with GitHub OIDC
        shell: bash
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp '^https://github.com/locoris/locoris/.github/workflows/personal-server-release.yml@refs/(tags/server-v.*|heads/main)$' \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_NAME}@${DIGEST}"
      - name: Create GitHub container attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  finalize-release:
    name: Verify and publish server release
    needs:
      - prepare-release
      - desktop
      - docker-manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: locoris-server-*
          path: dist/release
          merge-multiple: true
      - name: Add compatibility contract
        run: cp docs/self-hosting/compatibility.json dist/release/Locoris-Server-compatibility.json
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: apps/personal-server
          format: spdx-json
          output-file: dist/release/Locoris-Server-${{ needs.prepare-release.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate unified checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist/release
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Upload verified assets to draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release upload "${TAG}" dist/release/* --clobber --repo "${GITHUB_REPOSITORY}"
      - name: Attest server artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/release/SHA256SUMS.txt
      - name: Attach server SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/release/SHA256SUMS.txt
          sbom-path: dist/release/Locoris-Server-${{ needs.prepare-release.outputs.version }}.spdx.json
      - name: Publish release with Docker digest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          DIGEST: ${{ needs.docker-manifest.outputs.digest }}
        run: |
          set -euo pipefail
          cp "docs/releases/server/${VERSION}.md" "${RUNNER_TEMP}/release-notes.md"
          printf '\n## Container digest\n\n`%s@%s`\n' "${IMAGE_NAME}" "${DIGEST}" >> "${RUNNER_TEMP}/release-notes.md"
          gh release edit "${TAG}" --draft=false --prerelease=false --notes-file "${RUNNER_TEMP}/release-notes.md" --repo "${GITHUB_REPOSITORY}"
