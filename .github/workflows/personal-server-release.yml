name: Personal Server Release
run-name: Locoris Server release · ${{ github.ref_name }}

on:
  push:
    tags:
      - "server-v*"
  workflow_dispatch:

concurrency:
  group: personal-server-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"

jobs:
  desktop:
    name: Locoris Server · ${{ matrix.label }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS arm64
            artifact: macos-arm64
          - os: macos-15-intel
            label: macOS x64
            artifact: macos-x64
          - os: windows-2025
            label: Windows x64
            artifact: windows-x64
          - os: ubuntu-24.04
            label: Linux x64
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci --prefer-offline --no-audit; then
              exit 0
            fi
            if [ "${attempt}" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done
      - name: Validate release version
        shell: bash
        run: |
          package_version="$(node -p "require('./apps/personal-server/package.json').version")"
          tag_version="${GITHUB_REF_NAME#server-v}"
          if [ "${package_version}" != "${tag_version}" ]; then
            echo "Server package version ${package_version} does not match tag ${tag_version}." >&2
            exit 1
          fi
      - run: npm test --workspace @locoris/personal-server
      - run: npm run desktop:dist --workspace @locoris/personal-server
      - name: Smoke-test packaged desktop application
        run: npm run desktop:smoke --workspace @locoris/personal-server
      - run: npm run desktop:checksums --workspace @locoris/personal-server -- ${{ matrix.artifact }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: locoris-server-${{ matrix.artifact }}
          path: |
            apps/personal-server/release-server/*.AppImage
            apps/personal-server/release-server/*.deb
            apps/personal-server/release-server/*.dmg
            apps/personal-server/release-server/*.exe
            apps/personal-server/release-server/*.zip
            apps/personal-server/release-server/SHA256SUMS-*.txt
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/server-v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          make_latest: false
          files: |
            apps/personal-server/release-server/*.AppImage
            apps/personal-server/release-server/*.deb
            apps/personal-server/release-server/*.dmg
            apps/personal-server/release-server/*.exe
            apps/personal-server/release-server/*.zip
            apps/personal-server/release-server/SHA256SUMS-*.txt

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - if: startsWith(github.ref, 'refs/tags/server-v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/locoris-server
          tags: |
            type=match,pattern=server-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/server-v') }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/personal-server/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/server-v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
