name: Tauri release

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing app-v* tag to rebuild
        required: true
        type: string

concurrency:
  group: tauri-release-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"
  JAVA_VERSION: "17"
  ANDROID_NDK_VERSION: "27.0.12077973"
  ANDROID_RELEASE_CERTIFICATE_SHA256: "b6f8dfa354b44da34ed25ec3476d327768584687e72fa42fabd1a1f61f4e5869"
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  VITE_LOCORIS_CLOUD_URL: ${{ vars.VITE_LOCORIS_CLOUD_URL || 'https://locoris-api.duckdns.org' }}
  VITE_GOOGLE_DRIVE_CLIENT_ID: ${{ vars.VITE_GOOGLE_DRIVE_CLIENT_ID }}
  VITE_GOOGLE_DRIVE_DESKTOP_CLIENT_ID: ${{ vars.VITE_GOOGLE_DRIVE_DESKTOP_CLIENT_ID }}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  prepare-release:
    name: Prepare atomic release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate tag, version, and release notes
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_TAG}" =~ ^app-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match app-vX.Y.Z." >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/${REQUESTED_TAG}^{commit}"
          VERSION="${REQUESTED_TAG#app-v}"
          PACKAGE_VERSION="$(node -p "require('./apps/app/package.json').version")"
          if [ "${VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "App package version ${PACKAGE_VERSION} does not match ${REQUESTED_TAG}." >&2
            exit 1
          fi
          npm run release:notes:check -- --kind app --version "${VERSION}"
          echo "tag=${REQUESTED_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Create or reset hidden draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="docs/releases/app/${VERSION}.md"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --draft --prerelease=false --notes-file "${NOTES}" --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" --verify-tag --draft --title "Locoris ${VERSION}" --notes-file "${NOTES}" --repo "${GITHUB_REPOSITORY}"
          fi

  release-desktop:
    name: Build desktop (${{ matrix.label }})
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            label: macOS Apple Silicon
            apple_signing_identity: "-"
          - platform: windows-2025
            label: Windows x64
            apple_signing_identity: ""
    runs-on: ${{ matrix.platform }}
    env:
      LOCORIS_DESKTOP_BUILD: "true"
      APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
      VITE_GOOGLE_DRIVE_DESKTOP_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_DRIVE_DESKTOP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/app/src-tauri -> apps/app/src-tauri/target
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci --prefer-offline --no-audit; then exit 0; fi
            if [ "${attempt}" = "3" ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - run: npm run test --workspace @locoris/app
      - run: npm run i18n:check
      - name: Validate Google Drive OAuth environment
        run: >
          node -e "const required=['VITE_GOOGLE_DRIVE_CLIENT_ID','VITE_GOOGLE_DRIVE_DESKTOP_CLIENT_ID','VITE_GOOGLE_DRIVE_DESKTOP_CLIENT_SECRET'];
          const missing=required.filter((key)=>!process.env[key]||!process.env[key].trim());
          if(missing.length){console.error('Missing GitHub Actions variables: '+missing.join(', ')); process.exit(1);}"
      - name: Load updater release notes
        id: updater-notes
        shell: bash
        env:
          NOTES_PATH: docs/releases/app/${{ needs.prepare-release.outputs.version }}.md
        run: |
          {
            echo 'body<<LOCORIS_RELEASE_NOTES'
            cat "${NOTES_PATH}"
            echo 'LOCORIS_RELEASE_NOTES'
          } >> "${GITHUB_OUTPUT}"
      - name: Build and upload desktop assets to draft
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/app
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: Locoris ${{ needs.prepare-release.outputs.version }}
          releaseBody: ${{ steps.updater-notes.outputs.body }}
          releaseDraft: true
          prerelease: false
      - name: Verify ad-hoc macOS application signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find apps/app/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "${APP_PATH}"
          codesign --verify --deep --strict "${APP_PATH}"
          codesign --display --verbose=2 "${APP_PATH}"

  build-android-apk:
    name: Build signed Android APK
    needs: prepare-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - run: sdkmanager "ndk;${ANDROID_NDK_VERSION}"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/app/src-tauri -> apps/app/src-tauri/target
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci --prefer-offline --no-audit; then exit 0; fi
            if [ "${attempt}" = "3" ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - run: npm run test --workspace @locoris/app
      - run: npm run i18n:check
      - run: npm run typecheck --workspace @locoris/app
      - run: npm run build --workspace @locoris/app
      - name: Validate release keystore secrets
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!value}" ]; then echo "Missing Android signing secret: ${value}" >&2; exit 1; fi
          done
      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/android-signing"
          printf '%s' "${KEYSTORE}" | base64 --decode > "${RUNNER_TEMP}/android-signing/locoris-release.keystore"
          chmod 600 "${RUNNER_TEMP}/android-signing/locoris-release.keystore"
      - name: Build signed APK
        env:
          LOCORIS_ANDROID_BUILD: "true"
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/android-signing/locoris-release.keystore
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: npm run android:build:apk --workspace @locoris/app
      - name: Verify and package APK
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          APK_SOURCE="$(find apps/app/src-tauri/gen/android/app/build/outputs/apk -type f -name '*release*.apk' | sort | head -n 1)"
          test -n "${APK_SOURCE}"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${APKSIGNER}"
          VERIFY_OUTPUT="$(${APKSIGNER} verify --verbose --print-certs "${APK_SOURCE}")"
          printf '%s\n' "${VERIFY_OUTPUT}"
          FINGERPRINT="$(printf '%s\n' "${VERIFY_OUTPUT}" | node apps/app/scripts/android-signing-output.mjs)"
          test -n "${FINGERPRINT}"
          if [ "${FINGERPRINT}" != "${ANDROID_RELEASE_CERTIFICATE_SHA256}" ]; then
            echo "Android release certificate does not match the pinned Locoris fingerprint." >&2
            exit 1
          fi
          mkdir -p dist/android-release
          APK_NAME="Locoris-Android-${VERSION}.apk"
          cp "${APK_SOURCE}" "dist/android-release/${APK_NAME}"
          SHA256="$(sha256sum "dist/android-release/${APK_NAME}" | awk '{print $1}')"
          printf '%s  %s\n' "${SHA256}" "${APK_NAME}" > "dist/android-release/${APK_NAME}.sha256"
          printf 'Locoris Android signing certificate SHA-256\n%s\n' "${FINGERPRINT}" > "dist/android-release/${APK_NAME}.certificate.txt"
          node -e "const fs=require('fs'); const data={version:process.argv[1],tag:process.argv[2],packageName:'com.locoris.android',apk:process.argv[3],sha256:process.argv[4],certificateSha256:process.argv[5],publishedAt:new Date().toISOString()}; fs.writeFileSync('dist/android-release/android-latest.json', JSON.stringify(data,null,2)+'\n');" "${VERSION}" "${TAG}" "${APK_NAME}" "${SHA256}" "${FINGERPRINT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: locoris-android-release-assets
          path: dist/android-release/*
          if-no-files-found: error

  finalize-release:
    name: Verify and publish atomic release
    needs:
      - prepare-release
      - release-desktop
      - build-android-apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: locoris-android-release-assets
          path: dist/android-release
      - name: Download desktop draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          gh release download "${TAG}" --dir dist/release --clobber --repo "${GITHUB_REPOSITORY}"
          cp dist/android-release/* dist/release/
      - name: Generate SPDX SBOM
        shell: bash
        run: npm sbom --workspace @locoris/app --omit=dev --package-lock-only --sbom-format=spdx > "dist/release/Locoris-${{ needs.prepare-release.outputs.version }}.spdx.json"
      - name: Validate application SPDX SBOM
        shell: bash
        env:
          SBOM_PATH: dist/release/Locoris-${{ needs.prepare-release.outputs.version }}.spdx.json
        run: |
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(process.env.SBOM_PATH,'utf8')); if (!Array.isArray(data.packages) || data.packages.length < 100) throw new Error('Application SBOM is missing production dependency metadata'); console.log('Verified '+data.packages.length+' SPDX packages.');"
      - name: Generate application release manifest
        run: >
          node ./scripts/generate-release-manifest.mjs
          --kind app
          --version "${{ needs.prepare-release.outputs.version }}"
          --tag "${{ needs.prepare-release.outputs.tag }}"
          --directory dist/release
          --output dist/release/locoris-app-release.json
      - name: Generate unified checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist/release
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Upload verified release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release upload "${TAG}" dist/release/* --clobber --repo "${GITHUB_REPOSITORY}"
      - name: Validate updater metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node ./scripts/validate-release-metadata.mjs
          --repo "${GITHUB_REPOSITORY}"
          --tag "${{ needs.prepare-release.outputs.tag }}"
          --expected-version "${{ needs.prepare-release.outputs.version }}"
          --targets "darwin-aarch64,windows-x86_64"
          --allow-draft
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/release/SHA256SUMS.txt
      - name: Attach SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/release/SHA256SUMS.txt
          sbom-path: dist/release/Locoris-${{ needs.prepare-release.outputs.version }}.spdx.json
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          gh release edit "${TAG}" --draft=false --prerelease=false --latest --notes-file "docs/releases/app/${VERSION}.md" --repo "${GITHUB_REPOSITORY}"
      - name: Refresh the product website
        shell: bash
        env:
          SITE_DEPLOY_HOOK: ${{ secrets.LOCORIS_SITE_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_DEPLOY_HOOK}" ]; then
            echo "::notice::LOCORIS_SITE_DEPLOY_HOOK is not configured; the website release snapshot was not refreshed."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-all-errors --request POST "${SITE_DEPLOY_HOOK}"
