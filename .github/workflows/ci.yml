name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"

jobs:
  app:
    name: App quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci --prefer-offline --no-audit; then
              exit 0
            fi
            if [ "${attempt}" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done
      - name: Typecheck
        run: npm run typecheck
      - name: Test application contracts
        run: npm test --workspace @locoris/app
      - name: Validate localization catalogs
        run: npm run i18n:check
      - name: Build web application
        run: npm run build
      - name: Check patch whitespace
        run: git diff --check

  personal-server:
    name: Personal Server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci --prefer-offline --no-audit; then
              exit 0
            fi
            if [ "${attempt}" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done
      - name: Test server contracts
        run: npm test --workspace @locoris/personal-server
      - name: Build production container
        run: docker build --file infra/docker/personal-server/Dockerfile --tag locoris-server:ci .

  native-core:
    name: Native core
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/app/src-tauri -> apps/app/src-tauri/target
      - name: Check native core
        run: cargo check --manifest-path apps/app/src-tauri/Cargo.toml --locked

  compliance:
    name: License and notices
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci --prefer-offline --no-audit; then
              exit 0
            fi
            if [ "${attempt}" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done
      - name: Verify generated third-party notices
        run: npm run notices:check
